openapi: 3.0.3
info:
  title: TMTechEasy Gate API
  version: 0.1.0
  description: |
    Resolves Nigeria's NIPOST digital postcodes to exact building footprints, and routes
    delivery riders and emergency responders (fire, ambulance, police) to the building's gate.
    Emergency call-taking and dispatch systems can use the same lookup and routing endpoints:
    a caller's postcode becomes the building, its entrance and a road route to it.
    The platform gives directions only; it does not alert or dispatch emergency services.

    **Postcodes** have 11 characters in 5 segments: State (2 letters), LGA (2 digits),
    District (3 alphanumerics), Area (2 letters), Building unit (2 digits), e.g.
    `FC 02 SIM BP 87`. Spaces, dashes and letter case are ignored, so `fc-02-sim-bp-87`
    and `FC02SIMBP87` are the same code. Responses always use the compact form
    (`code`) plus a display form (`formatted`).

    **Coordinates** are WGS84 `[longitude, latitude]` in that order, as in GeoJSON.

    **Pilot data:** buildings in Wuse 2, Abuja come from OpenStreetMap and carry
    *simulated* codes in district `SIM`, which is never a real NIPOST district. Real codes
    are checked against the NIPOST Digital Postcode API when the server has a key.

    **Authentication:** send your key in the `X-API-Key` header on every request except
    health and docs. Keys are issued per partner; contact the platform team for one.
    Missing or invalid keys get `401`.

    **Rate limits:** each key has a per-minute limit (default 120). Every response carries
    `X-RateLimit-Limit` and `X-RateLimit-Remaining`. Over the limit you get `429` with
    `Retry-After` (seconds).

    **Errors** share one shape: `{ "error": "MACHINE_CODE", "message": "Human text" }`.
security:
  - ApiKeyAuth: []
servers:
  - url: /
    description: This server
tags:
  - name: Lookup
    description: Resolve postcodes and map positions to buildings.
  - name: Routing
    description: Road routes to a building's gate, for riders and emergency responders.
  - name: Claims
    description: Owner-submitted home profiles and shareable links.
  - name: Dispatch
    description: |
      Delivery runs for riders: ordered stops (optionally reordered for the shortest route),
      a public tracking link per stop for the customer, live rider position, and proof of
      delivery by code and/or photo. Creating a run uses your API key; the rider's phone then
      authenticates its own updates with the run's `rider_token`.
  - name: Account
    description: |
      A signed-in website user's own places. These use the website's Supabase Auth session
      cookie, not partner API keys: accounts belong to people, not integrations.
  - name: Maps
    description: Map data for drawing the platform's buildings.
  - name: System

paths:
  /api/v1/navigate/{code}:
    get:
      tags: [Lookup]
      operationId: navigate
      summary: Resolve a postcode to its building
      description: |
        Looks the code up in the platform's building database and, in parallel, checks it
        with NIPOST. If the code isn't mapped here but NIPOST returns coordinates (lookup
        level 5), the building footprint at that point is returned instead, with
        `source: nipost`.
      parameters:
        - $ref: '#/components/parameters/Code'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '200':
          description: The building, as a GeoJSON footprint plus center point.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NavigateResponse' }
        '400': { $ref: '#/components/responses/InvalidPostcode' }
        '404':
          description: |
            `POSTCODE_NOT_FOUND`: not mapped and not confirmed by NIPOST.
            `POSTCODE_NOT_MAPPED`: NIPOST confirms the code, but its building isn't on the platform yet.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      code: { type: string, example: FC01A01KP27 }
                      verification: { $ref: '#/components/schemas/Verification' }

  /api/v1/navigate/{code}/route:
    get:
      tags: [Routing]
      operationId: routeToBuilding
      summary: Route a rider to a building
      description: |
        Road route from the rider's position to the building, plus `lastMile`: the
        on-foot leg from where the road ends to the building's gate, or to its
        center when no gate is mapped (`destination.kind`).
      parameters:
        - $ref: '#/components/parameters/Code'
        - name: from
          in: query
          required: true
          description: Rider position as `lng,lat`.
          schema: { type: string, example: '7.4755,9.0790' }
        - name: profile
          in: query
          required: false
          description: Travel mode. There is no motorbike profile; use `driving` for dispatch bikes.
          schema: { type: string, enum: [driving, cycling, walking], default: driving }
        - name: claim
          in: query
          required: false
          description: |
            Share id of a claim on this building (from a `/h/{share_id}` link). If its owner marked
            a gate, the route ends there (`destination.source: claim`).
          schema: { type: string, format: uuid }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '200':
          description: Route, last-mile leg and the destination building.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteResponse' }
        '400':
          description: '`INVALID_POSTCODE`, `INVALID_ORIGIN` or `INVALID_PROFILE`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/PostcodeNotFound' }
        '422':
          description: '`NO_ROUTE`: no road connects the two points.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: '`ROUTING_FAILED` or `NETWORK_ERROR`: the routing provider failed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: '`ROUTING_NOT_CONFIGURED`: this server has no routing provider.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/buildings/at:
    get:
      tags: [Lookup]
      operationId: buildingAt
      summary: Find the building at a map position
      description: |
        Returns the footprint containing the point, or the nearest one within 12 m.
        Used for "drop a pin on your building".
      parameters:
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180, example: 7.4854694 }
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90, example: 9.0675872 }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '200':
          description: The building under the pin.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BuildingResult'
                  - type: object
                    required: [pin]
                    properties:
                      pin:
                        type: object
                        properties:
                          lng: { type: number }
                          lat: { type: number }
                          distance_m: { type: number, description: '0 when the point is inside the footprint.' }
        '400':
          description: '`INVALID_COORDINATES`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: '`NO_BUILDING_HERE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/buildings/{code}/claims:
    post:
      tags: [Claims]
      operationId: createClaim
      summary: Claim a building as your place
      description: |
        Attaches a label, delivery notes and optionally a gate to a building. The response's
        `share_id` makes the shareable link `/h/{share_id}`; keep `id` to manage the claim.
        Claims are **unverified**. From this website the user must be signed in (`401
        SIGN_IN_REQUIRED` otherwise) and owns the claim; claims created with a partner API
        key have no owner. Rate limited to 20 per caller per hour.
      parameters:
        - $ref: '#/components/parameters/Code'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimCreate' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '201':
          description: Claim created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400':
          description: '`INVALID_POSTCODE`, `INVALID_CLAIM`, or `GATE_TOO_FAR` (gate more than 30 m from the building).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/PostcodeNotFound' }
        '429':
          description: '`RATE_LIMITED`; see the `Retry-After` header.'
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the limit resets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/claims/{id}:
    get:
      tags: [Claims]
      operationId: getClaim
      summary: Get a shared place
      description: |
        The home profile behind a shareable link `/h/{share_id}`. Knowing the share id is
        the only access control, so treat it as a secret. Owners can revoke it by issuing a
        new one (`POST /api/v1/me/claims/{id}/share-link`), after which this returns 404.
      parameters:
        - name: id
          in: path
          required: true
          description: The claim's share id.
          schema: { type: string, format: uuid }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '200':
          description: The claim and its building.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BuildingResult'
                  - type: object
                    required: [claim]
                    properties:
                      claim:
                        type: object
                        properties:
                          share_id: { type: string, format: uuid }
                          label: { type: string }
                          delivery_notes: { type: string, nullable: true }
                          gate: { $ref: '#/components/schemas/Gate' }
                          status: { $ref: '#/components/schemas/ClaimStatus' }
                          created_at: { type: string, format: date-time }
        '404':
          description: '`CLAIM_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/runs:
    post:
      tags: [Dispatch]
      operationId: createRun
      summary: Start a delivery run
      description: |
        Creates a run with up to 25 stops, each with its own customer tracking link
        (`tracking_url`). Set `optimize: true` with the rider's position in `from` to reorder up to
        11 stops for the shortest route. A stop can carry a 4-digit `pod_code` (yours, or
        `require_code: true` to generate one): tell it to the customer; the rider must enter it to
        complete the stop. Codes appear only in this response, never on tracking pages.
        Keep `run.rider_token` on the rider's phone: it authorises position updates and completions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunCreate' }
      responses:
        '201':
          description: The run, its rider token, and the stops in visiting order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400':
          description: '`INVALID_RUN`, `INVALID_POSTCODE`, `INVALID_PROFILE`, `INVALID_ORIGIN` or `TOO_MANY_STOPS`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/PostcodeNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/runs/{id}:
    get:
      tags: [Dispatch]
      operationId: getRun
      summary: Get a run (rider)
      description: The run's stops in order with their status. Never includes delivery codes.
      security:
        - RiderToken: []
      parameters:
        - { name: id, in: path, required: true, description: Run id., schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The run and its stops.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/InvalidRiderToken' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/runs/{id}/position:
    post:
      tags: [Dispatch]
      operationId: updateRunPosition
      summary: Report the rider's position
      description: |
        Send every ~10 seconds while riding. `current_stop` with `remaining_m`/`eta_s` updates that
        stop's customer page; `arrived: true` marks the rider as at the stop.
      security:
        - RiderToken: []
      parameters:
        - { name: id, in: path, required: true, description: Run id., schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RiderPosition' }
      responses:
        '204': { description: Recorded. }
        '400':
          description: '`INVALID_POSITION`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/InvalidRiderToken' }
        '409':
          description: '`RUN_ENDED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/runs/{id}/stops/{index}/complete:
    post:
      tags: [Dispatch]
      operationId: completeStop
      summary: Proof of delivery for a stop
      description: |
        If the stop has a delivery code, `pod_code` must match (5 wrong tries per 15 minutes).
        Otherwise a `photo` is required. A photo can be sent in either case.
      security:
        - RiderToken: []
      parameters:
        - { name: id, in: path, required: true, description: Run id., schema: { type: string, format: uuid } }
        - { name: index, in: path, required: true, description: Stop index (0-based)., schema: { type: integer, minimum: 0, example: 0 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProofOfDelivery' }
      responses:
        '200':
          description: Delivered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stop_index: { type: integer }
                  status: { type: string, enum: [delivered] }
                  delivered_at: { type: string, format: date-time }
                  pod_method: { type: string, enum: [code, photo, code+photo] }
                  next_stop: { type: integer, nullable: true, description: 'Next unfinished stop; null when the run is done.' }
        '400':
          description: '`WRONG_CODE`, `POD_REQUIRED`, `INVALID_PHOTO` or `INVALID_STOP`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/InvalidRiderToken' }
        '404':
          description: '`STOP_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`ALREADY_DELIVERED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: '`PHOTO_TOO_LARGE` (over 1.5 MB).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/runs/{id}/end:
    post:
      tags: [Dispatch]
      operationId: endRun
      summary: End a run early
      description: Unfinished stops are marked failed and their tracking pages say so.
      security:
        - RiderToken: []
      parameters:
        - { name: id, in: path, required: true, description: Run id., schema: { type: string, format: uuid } }
      responses:
        '204': { description: Ended. }
        '401': { $ref: '#/components/responses/InvalidRiderToken' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/track/{token}:
    get:
      tags: [Dispatch]
      operationId: trackDelivery
      summary: Track a delivery
      description: |
        Public status for the customer's tracking page (`/t/{token}`). The rider's live position
        and ETA are included only once this is the rider's current stop.
      security: []
      parameters:
        - { name: token, in: path, required: true, description: "Tracking token from the stop's tracking_url.", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Delivery status, destination building and (when current) the rider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tracking' }
        '404':
          description: '`DELIVERY_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/track/{token}/photo:
    get:
      tags: [Dispatch]
      operationId: trackDeliveryPhoto
      summary: Proof-of-delivery photo
      security: []
      parameters:
        - { name: token, in: path, required: true, description: "Tracking token from the stop's tracking_url.", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The photo.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '404':
          description: '`PHOTO_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/me:
    delete:
      tags: [Account]
      operationId: deleteMyAccount
      summary: Delete my account
      description: |
        Permanently deletes the signed-in user's account and their places (whose share links
        stop working). Delivery runs they started are kept without the link to the account.
        The only remaining admin can't delete their account until another admin is added.
      security:
        - SessionCookie: []
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '409':
          description: '`LAST_ADMIN`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/me/claims:
    get:
      tags: [Account]
      operationId: listMyClaims
      summary: List my places
      security:
        - SessionCookie: []
      responses:
        '200':
          description: The signed-in user's claims, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  claims:
                    type: array
                    items: { $ref: '#/components/schemas/Claim' }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/me/claims/{id}:
    patch:
      tags: [Account]
      operationId: updateMyClaim
      summary: Edit one of my places
      description: "Send only the fields to change. `gate: null` removes the gate."
      security:
        - SessionCookie: []
      parameters:
        - { name: id, in: path, required: true, description: "The claim id (not the share id).", schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimUpdate' }
      responses:
        '200':
          description: The updated claim.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400':
          description: '`INVALID_CLAIM` or `GATE_TOO_FAR`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '404': { $ref: '#/components/responses/ClaimNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Account]
      operationId: deleteMyClaim
      summary: Delete one of my places
      description: Its share link stops working immediately.
      security:
        - SessionCookie: []
      parameters:
        - { name: id, in: path, required: true, description: "The claim id (not the share id).", schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '404': { $ref: '#/components/responses/ClaimNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/me/claims/{id}/share-link:
    post:
      tags: [Account]
      operationId: rotateMyShareLink
      summary: Revoke and replace a share link
      description: Issues a new `share_id`. Anyone holding the old link loses access.
      security:
        - SessionCookie: []
      parameters:
        - { name: id, in: path, required: true, description: "The claim id (not the share id).", schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The claim with its new `share_id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '401': { $ref: '#/components/responses/SignInRequired' }
        '404': { $ref: '#/components/responses/ClaimNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/tiles/buildings/{z}/{x}/{y}:
    get:
      tags: [Maps]
      operationId: buildingTiles
      summary: Building footprints as vector tiles
      description: |
        Every mapped building as [Mapbox Vector Tiles](https://github.com/mapbox/vector-tile-spec),
        for drawing them in 3D (e.g. a Mapbox GL `fill-extrusion` layer). Layer `buildings`;
        each feature's id is the building id, with properties `height` (metres, from OSM
        or estimated from the footprint), `height_known` and `type`.

        Use the template `/api/v1/tiles/buildings/{z}/{x}/{y}.mvt`. Tiles exist from zoom 13;
        lower zooms return 204. Public and cacheable, so no API key is needed.
      security: []
      parameters:
        - { name: z, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 22, example: 15 } }
        - { name: x, in: path, required: true, schema: { type: integer, minimum: 0, example: 17065 } }
        - name: y
          in: path
          required: true
          description: Tile row, with or without the `.mvt` suffix.
          schema: { type: string, example: 15555.mvt }
      responses:
        '200':
          description: A vector tile.
          content:
            application/vnd.mapbox-vector-tile:
              schema: { type: string, format: binary }
        '204':
          description: No buildings in this tile, or zoom below 13.
        '400':
          description: '`INVALID_TILE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/health:
    get:
      tags: [System]
      operationId: health
      summary: Health and configuration
      security: []
      responses:
        '200':
          description: Server is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  nipost: { type: string, example: level 1 }
                  routing: { type: string, example: mapbox }

components:
  parameters:
    Code:
      name: code
      in: path
      required: true
      description: NIPOST postcode in any spacing or case.
      schema: { type: string, example: FC-02-SIM-BP-87 }

  securitySchemes:
    RiderToken:
      type: apiKey
      in: header
      name: X-Rider-Token
      description: The `rider_token` returned when the run was created.
    SessionCookie:
      type: apiKey
      in: cookie
      name: sb-<project-ref>-auth-token
      description: Supabase Auth session cookie set by signing in on this website (email or SMS code).
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Partner key (`n3d_live_…`), issued per organisation.'

  responses:
    Unauthorized:
      description: '`API_KEY_REQUIRED` or `INVALID_API_KEY`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: '`RATE_LIMITED`; retry after the number of seconds in `Retry-After`.'
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidRiderToken:
      description: '`INVALID_RIDER_TOKEN`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SignInRequired:
      description: '`SIGN_IN_REQUIRED`: sign in on the website first.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ClaimNotFound:
      description: '`CLAIM_NOT_FOUND`: no such claim in your account.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidPostcode:
      description: '`INVALID_POSTCODE`: not in the 11-character NIPOST format.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PostcodeNotFound:
      description: '`POSTCODE_NOT_FOUND`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, example: INVALID_POSTCODE }
        message: { type: string }

    LngLat:
      type: array
      description: '[longitude, latitude]'
      items: { type: number }
      minItems: 2
      maxItems: 2
      example: [7.4854694, 9.0675872]

    Segments:
      type: object
      properties:
        state: { type: string, example: FC }
        lga: { type: string, example: '02' }
        district: { type: string, example: SIM }
        area: { type: string, example: BP }
        building: { type: string, example: '88' }

    Verification:
      type: object
      description: Result of checking the code with NIPOST.
      properties:
        source: { type: string, enum: [nipost] }
        status:
          type: string
          enum: [verified, unregistered, not_in_sandbox, unavailable, not_configured]
          description: |
            `verified`: NIPOST confirms the code. `unregistered`: a live NIPOST key says it
            doesn't exist. `not_in_sandbox`: a test key can only see NIPOST's sandbox, so this
            says nothing about real codes. `unavailable`: NIPOST couldn't be reached.
            `not_configured`: the server has no NIPOST key.
        environment: { type: string, enum: [test, live] }
        level: { type: integer, minimum: 1, maximum: 5 }
        reason: { type: string, description: 'Set when status is `unavailable`.' }

    BuildingProperties:
      type: object
      description: Building metadata. Fields vary by data source; all are optional except `nipost_code`.
      required: [nipost_code]
      additionalProperties: true
      properties:
        nipost_code: { type: string, example: FC02SIMBP87 }
        name: { type: string, example: Silverbird Cinemas & Shopping Centre }
        building_type: { type: string, example: commercial }
        height_m: { type: number, example: 12.8, description: Known height from OpenStreetMap. }
        render_height_m: { type: number, example: 12.8, description: 'Height the 3D map draws: height_m if known, else an estimate from the footprint.' }
        floors: { type: number, example: 4 }
        source: { type: string, example: osm }
        code_source: { type: string, enum: [simulated, nipost] }
        gate:
          type: object
          description: Mapped entrance, when known.
          properties:
            lng: { type: number }
            lat: { type: number }
            type: { type: string, example: main }

    BuildingFeature:
      type: object
      description: GeoJSON Feature with the building footprint polygon.
      required: [type, geometry, properties]
      properties:
        type: { type: string, enum: [Feature] }
        id: { type: integer }
        geometry:
          type: object
          properties:
            type: { type: string, enum: [Polygon] }
            coordinates:
              type: array
              items:
                type: array
                items: { $ref: '#/components/schemas/LngLat' }
        properties: { $ref: '#/components/schemas/BuildingProperties' }

    BuildingResult:
      type: object
      required: [code, formatted, segments, center, bbox, building]
      properties:
        code: { type: string, example: FC02SIMBP87 }
        formatted: { type: string, example: FC 02 SIM BP 87 }
        segments: { $ref: '#/components/schemas/Segments' }
        source:
          type: string
          enum: [platform, nipost]
          description: '`nipost` when the location came from NIPOST coordinates.'
        center:
          allOf: [{ $ref: '#/components/schemas/LngLat' }]
          description: A point guaranteed to be inside the footprint; use it for camera and routing.
        bbox:
          type: array
          nullable: true
          items: { type: number }
          description: '[minLng, minLat, maxLng, maxLat]'
          example: [7.4852, 9.0674, 7.4857, 9.0677]
        building:
          allOf: [{ $ref: '#/components/schemas/BuildingFeature' }]
          nullable: true
          description: Null only when NIPOST gave a point with no footprint mapped there.

    NavigateResponse:
      allOf:
        - $ref: '#/components/schemas/BuildingResult'
        - type: object
          properties:
            verification: { $ref: '#/components/schemas/Verification' }
            nipostPoint: { $ref: '#/components/schemas/LngLat' }

    RouteResponse:
      allOf:
        - $ref: '#/components/schemas/BuildingResult'
        - type: object
          required: [profile, origin, destination, route]
          properties:
            profile: { type: string, enum: [driving, cycling, walking] }
            origin: { $ref: '#/components/schemas/LngLat' }
            destination:
              type: object
              properties:
                point: { $ref: '#/components/schemas/LngLat' }
                kind: { type: string, enum: [gate, center] }
                source:
                  type: string
                  enum: [claim, map, building]
                  description: '`claim`: the owner''s marked gate. `map`: an entrance from OpenStreetMap. `building`: the footprint center.'
            route:
              type: object
              properties:
                geometry:
                  type: object
                  description: GeoJSON LineString along the roads.
                  properties:
                    type: { type: string, enum: [LineString] }
                    coordinates:
                      type: array
                      items: { $ref: '#/components/schemas/LngLat' }
                distance_m: { type: integer, example: 4240 }
                duration_s: { type: integer, example: 660 }
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      instruction: { type: string, example: Turn left onto Ahmadu Bello Way. }
                      distance_m: { type: integer }
                      road: { type: string }
                      maneuver: { type: string, example: turn }
                      location: { $ref: '#/components/schemas/LngLat' }
            lastMile:
              type: object
              nullable: true
              description: On-foot leg from the end of the road to the destination; null when under 3 m.
              properties:
                geometry:
                  type: object
                  properties:
                    type: { type: string, enum: [LineString] }
                    coordinates:
                      type: array
                      items: { $ref: '#/components/schemas/LngLat' }
                distance_m: { type: integer, example: 41 }

    ClaimStatus:
      type: string
      enum: [unverified, verified, rejected]

    Gate:
      type: object
      nullable: true
      description: The entrance riders should use, marked by the claimant. Must be within 30 m of the building.
      example: { lng: 7.48555, lat: 9.06762 }
      properties:
        lng: { type: number, example: 7.48555 }
        lat: { type: number, example: 9.06762 }

    ClaimCreate:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 80, example: Flat 3B }
        delivery_notes: { type: string, maxLength: 500, example: 'Blue gate on the left, ring twice' }
        gate: { $ref: '#/components/schemas/Gate' }

    RunCreate:
      type: object
      required: [stops]
      properties:
        profile: { type: string, enum: [driving, cycling, walking], default: driving }
        optimize: { type: boolean, default: false, description: 'Reorder stops for the shortest route (needs from).' }
        from:
          allOf: [{ $ref: '#/components/schemas/LngLat' }]
          description: The rider's current position.
        stops:
          type: array
          minItems: 1
          maxItems: 25
          example: [{ code: FC-02-SIM-BP-87, recipient_name: Ade, require_code: true }]
          items:
            type: object
            required: [code]
            properties:
              code: { type: string, example: FC-02-SIM-BP-87 }
              claim: { type: string, format: uuid, description: 'Share id of a claim on this building: route to its gate.' }
              recipient_name: { type: string, maxLength: 80 }
              pod_code: { type: string, pattern: '^[0-9]{4}$', description: Your 4-digit delivery code. }
              require_code: { type: boolean, description: Generate a 4-digit delivery code. }

    Run:
      type: object
      properties:
        run:
          type: object
          properties:
            id: { type: string, format: uuid }
            rider_token: { type: string, description: 'Secret for the rider''s phone; shown once.' }
            rider_url: { type: string, format: uri, description: 'Opens the run in the Rider View on the rider''s phone (token in the #fragment).' }
            profile: { type: string }
            status: { type: string, enum: [active, ended] }
            optimized: { type: boolean }
        stops:
          type: array
          items:
            type: object
            properties:
              stop_index: { type: integer }
              delivery_id: { type: string, format: uuid }
              code: { type: string }
              formatted: { type: string }
              building_name: { type: string, nullable: true }
              recipient_name: { type: string, nullable: true }
              destination:
                type: object
                properties:
                  point: { $ref: '#/components/schemas/LngLat' }
                  kind: { type: string, enum: [gate, center] }
                  source: { type: string, enum: [claim, map, building] }
              tracking_token: { type: string, format: uuid }
              tracking_url: { type: string, format: uri, description: Send this to the customer. }
              requires_code: { type: boolean }
              status: { type: string, enum: [pending, en_route, arrived, delivered, failed] }
              pod_code: { type: string, description: 'Only when the stop has a delivery code.' }

    RiderPosition:
      type: object
      required: [lng, lat]
      properties:
        lng: { type: number, example: 7.4800 }
        lat: { type: number, example: 9.0700 }
        heading: { type: number, description: Compass degrees. }
        current_stop: { type: integer, example: 0 }
        remaining_m: { type: number }
        eta_s: { type: number }
        arrived: { type: boolean }

    ProofOfDelivery:
      type: object
      properties:
        pod_code: { type: string, pattern: '^[0-9]{4}$', description: "The customer's delivery code, if the stop has one." }
        received_by: { type: string, maxLength: 80 }
        photo:
          type: string
          description: 'data:image/jpeg|png|webp;base64,… (max 1.5 MB).'
          example: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='

    Tracking:
      allOf:
        - $ref: '#/components/schemas/BuildingResult'
        - type: object
          properties:
            destination:
              type: object
              properties:
                point: { $ref: '#/components/schemas/LngLat' }
                kind: { type: string, enum: [gate, center] }
                source: { type: string, enum: [claim, map, building] }
            delivery:
              type: object
              properties:
                status: { type: string, enum: [pending, en_route, arrived, delivered, failed] }
                stop_index: { type: integer }
                stops_total: { type: integer }
                stops_before: { type: integer, description: Unfinished stops before this one. }
                recipient_name: { type: string, nullable: true }
                eta_s: { type: integer, nullable: true }
                remaining_m: { type: integer, nullable: true }
                delivered_at: { type: string, format: date-time, nullable: true }
                received_by: { type: string, nullable: true }
                pod_method: { type: string, nullable: true }
                has_photo: { type: boolean }
            rider:
              type: object
              nullable: true
              description: Only once this is the rider's current stop.
              properties:
                position: { $ref: '#/components/schemas/LngLat' }
                heading: { type: number, nullable: true }
                updated_at: { type: string, format: date-time }
                profile: { type: string }

    ClaimUpdate:
      type: object
      properties:
        label: { type: string, minLength: 1, maxLength: 80, example: Flat 3B }
        delivery_notes: { type: string, maxLength: 500, example: 'Blue gate on the left, ring twice' }
        gate: { $ref: '#/components/schemas/Gate' }

    Claim:
      type: object
      description: A claim as its owner (or the partner that created it) sees it.
      properties:
        id: { type: string, format: uuid, description: 'Claim id, for managing it.' }
        share_id: { type: string, format: uuid, description: 'Public link id: /h/{share_id}.' }
        code: { type: string, example: FC02SIMBP87 }
        formatted: { type: string, example: FC 02 SIM BP 87 }
        building_name: { type: string, nullable: true, example: Silverbird Cinemas & Shopping Centre }
        label: { type: string }
        delivery_notes: { type: string, nullable: true }
        gate: { $ref: '#/components/schemas/Gate' }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        created_at: { type: string, format: date-time }
